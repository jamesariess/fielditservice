<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ticket-scan apply test</title></head>
<!--
  Scan -> ticket form mapping test (no test runner needed).

  Run it by opening this file in a browser, or headless:
    msedge --headless=new --disable-gpu --dump-dom tests/ticket-scan-apply.html
  Every line in <pre id="out"> must start with PASS.
-->
<body>
<pre id="out">running</pre>

<!-- Minimal stand-in for the New Ticket form (same ids as tickets.php) -->
<div id="ticket-scan-modal" class="modal-overlay" style="display:none;"></div>
<div id="ticket-scan-results"></div>
<div id="ticket-scan-missing" style="display:none;"></div>
<input id="tt-ticket-no" type="text">
<input id="tt-serial" type="text">
<select id="tt-company"><option value="">—</option><option value="Field IT Services">Field IT Services</option><option value="__OTHER__">Other</option></select>
<input id="tt-company-other" type="text" style="display:none;">
<div id="tt-company-hint" style="display:none;"></div>
<select id="tt-task"><option value="">—</option><option value="Onsite visit">Onsite visit</option><option value="__OTHER__">Other</option></select>
<input id="tt-task-other" type="text" style="display:none;">
<div id="tt-task-hint" style="display:none;"></div>
<select id="tt-device"><option value="">—</option></select>
<input id="tt-device-other" type="text" style="display:none;">
<input id="tt-device-type" type="hidden">
<input id="tt-model-search" type="text">
<select id="tt-issue"><option value="">—</option><option value="7">No Power</option><option value="__OTHER__">Other</option></select>
<textarea id="tt-issue-custom" style="display:none;"></textarea>
<input id="tt-customer" type="text">
<textarea id="tt-address"></textarea>
<input id="tt-note" type="text">
<input id="tt-lat" type="hidden">
<input id="tt-lng" type="hidden">

<script>
var testErrors = [];
var toasts = [];
window.onerror = function (msg, src, line, col) { testErrors.push('JS-ERROR ' + msg + ' @' + line + ':' + col); };
function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function showToast(m, type) { toasts.push((type || 'info') + ': ' + m); }
function openModal() {}
function ttNormalizeName(v) { return String(v || '').toLowerCase().replace(/\s+/g, ' ').replace(/[^a-z0-9&.\- ]/g, '').trim(); }
function el(id) { return document.getElementById(id); }
function ttCompanyValue() {
    var sel = el('tt-company');
    return sel.value === '__OTHER__' ? String(el('tt-company-other').value || '').trim() : String(sel.value || '').trim();
}
function ttTaskValue() {
    var sel = el('tt-task');
    return sel.value === '__OTHER__' ? String(el('tt-task-other').value || '').trim() : String(sel.value || '').trim();
}
window.ttSelectedDeviceType = '';
window.ttSelectedModelName = '';
function ttPopulateDeviceDropdown() {
    var sel = el('tt-device');
    var html = '<option value="">—</option>';
    (window.ttEqData || []).forEach(function(row) {
        if (row.device_type && html.indexOf('value="' + row.device_type + '"') === -1) html += '<option value="' + row.device_type + '">' + row.device_type + '</option>';
    });
    html += '<option value="__OTHER__">Other</option>';
    sel.innerHTML = html;
    if (window.ttSelectedDeviceType) sel.value = window.ttSelectedDeviceType;
}
function ttSelectEquipment(id) {
    var row = null;
    (window.ttEqData || []).forEach(function(r) { if (r.id === id) row = r; });
    if (!row) return;
    window.ttSelectedDeviceType = row.device_type || '';
    window.ttSelectedModelName = row.model_name || '';
    el('tt-model-search').value = row.model_name || '';
    el('tt-serial').value = row.serial_number || '';
    el('tt-issue').value = '7';                  // the real code also rebuilds the problem list
    ttPopulateDeviceDropdown();                  // mirrors app.js: the card + dropdown are refreshed
}
function ttModelFreeText(v) { window.ttSelectedModelName = v; }
function ttIssueChanged() { el('tt-issue-custom').style.display = el('tt-issue').value ? 'none' : ''; }
function ttRenderAddressDatalist() {}
function ttResolveDestinationAddress() { window.ttGeoAsked = true; }
window.ttEqData = [
    { id: 1, manufacturer: 'Lenovo', model_name: 'ThinkPad T14 Gen 3', device_type: 'Laptop', serial_number: 'PWOEX84C' },
    { id: 2, manufacturer: 'HP', model_name: 'LaserJet Pro M404', device_type: 'Printer', serial_number: 'HPLCJ404X' }
];
</script>
<script src="../public/assets/js/ticket-scan.js"></script>
<script>
var SAMPLE = [
    'Work Order No.: SD1040842',
    'Company Name: Commonwealth Hospital and Medical Center T',
    'Address:',
    'DCD 7th Floor, Neopolitan Business Park, Regalado Highway,',
    'Brgy. Greater Lagro, Quezon, Metro Manila, NCR',
    'Contact Person: John Niel Laurenciano | MARK BACUMAG Contact Nos.: 02893000000 loc. 412',
    'Unit Reported: Lenovo 21L2S4VS00 L14 Gen 5 Serial/CRTL No.: PW0EX84C',
    'Request: · Repair / Service CustRef No.:',
    'Task Description / Reported Problem: Slow performance',
    'For onsite visit'
].join('\n');

var out = [];
function check(label, actual, expected) {
    var ok = String(actual) === String(expected);
    out.push((ok ? 'PASS ' : 'FAIL ') + label + ' => [' + actual + ']' + (ok ? '' : ' expected [' + expected + ']'));
}
try {
    ticketScanRenderResults(ticketScanParse(SAMPLE));
    ticketScanApply();
    check('tt-ticket-no', el('tt-ticket-no').value, '1040842');
    check('tt-company select', el('tt-company').value, '__OTHER__');
    check('tt-company-other', el('tt-company-other').value, 'Commonwealth Hospital and Medical Center');
    check('tt-serial (equipment record wins)', el('tt-serial').value, 'PWOEX84C');
    check('device type global', window.ttSelectedDeviceType, 'Laptop');
    check('tt-device select', el('tt-device').value, 'Laptop');
    check('tt-model-search', el('tt-model-search').value, 'ThinkPad T14 Gen 3');
    check('tt-task select', el('tt-task').value, '__OTHER__');
    check('tt-task-other', el('tt-task-other').value, 'Slow performance');
    check('tt-issue-custom', el('tt-issue-custom').value, 'Slow performance For onsite visit');
    check('tt-customer', el('tt-customer').value, 'John Niel Laurenciano');
    check('tt-address', el('tt-address').value, 'DCD 7th Floor, Neopolitan Business Park, Regalado Highway, Brgy. Greater Lagro, Quezon, Metro Manila, NCR');
    check('tt-note', el('tt-note').value, 'Request: Repair / Service · Contact No.: 02893000000 loc. 412');
    check('address handed to geocoder', window.ttGeoAsked, true);
    check('toast', toasts.join(' | '), 'info: Work order scanned — the form is filled in, but nothing is saved yet. Check the values, then tap Next and Create Ticket.');

    // A device that is not on file falls back to the printed Unit Reported text.
    ticketScanRenderResults(ticketScanParse([
        'Work Order No.: SD9999',
        'Company Name: Acme Corp',
        'Unit Reported: Hikvision DS-2CD1023G0E-I IP Camera',
        'Task Description / Reported Problem: No display'
    ].join('\n')));
    ticketScanApply();
    check('fallback ticket no', el('tt-ticket-no').value, '9999');
    check('fallback company', el('tt-company-other').value, 'Acme Corp');
    check('fallback device select', el('tt-device').value, '__OTHER__');
    check('fallback device text', el('tt-device-other').value, 'CCTV');
    check('fallback model', el('tt-model-search').value, 'DS-2CD1023G0E-I IP Camera');
    check('fallback task + problem', el('tt-task-other').value + ' | ' + el('tt-issue-custom').value, 'No display | No display');
    // Zenshi work order: TWO SD numbers. The topmost one fills the ticket no.,
    // and the other is offered next to the field so it can be swapped in a tap.
    var SHEET2 = [
        'Order No.: SD1041040',
        'Work Order No.: SD1041036',
        'Contact Person: Jan Michael Lukban - (Makati) Contact Nos.',
        'T 09178502783',
        'Company Name: Banco De Oro ②',
        'Address:',
        'T 09178502783 GIF. Power Plant Mall, Rockwell Center, Plaza Drive, Customer Request / Instruction:',
        'Brgy Poblacion, Makati, Metro Manila, NCR',
        'Unit Reported: Samsung ED40C Serial/CRTL No.: ZXVCHMFD600053B',
        'Task Description / Reported Problem:',
        'For dismantling of LFD.'
    ].join('\n');
    ticketScanRenderResults(ticketScanParse(SHEET2));
    var altBtn = document.querySelector('#ticket-scan-results [data-scan-use]');
    check('alt SD button offered', altBtn ? altBtn.getAttribute('data-scan-use') : 'none', '1041036');
    ticketScanApply();
    check('sheet topmost SD wins', el('tt-ticket-no').value, '1041040');
    check('sheet company applied', el('tt-company-other').value, 'Banco De Oro');
    check('sheet address applied', el('tt-address').value, 'G/F, Power Plant Mall, Rockwell Center, Plaza Drive, Brgy Poblacion, Makati, Metro Manila, NCR');
    check('sheet serial applied', el('tt-serial').value, 'ZXVCHMFD600053B');
    check('sheet device type guessed', window.ttSelectedDeviceType, 'Monitor');
    if (altBtn) altBtn.click();
    check('tapping the other SD refills the field', document.querySelector('#ticket-scan-results [data-scan-field="ticket_no"]').value, '1041036');

    // Nothing matched the SD prefix: the panel must say what it did read and
    // offer the number it found, so a bad read is visible instead of silent.
    ticketScanRenderResults(ticketScanParse('Zen Shi Systems Corporation\n264613131\nCompany Name: Banco De Oro'));
    var chips = document.querySelectorAll('#ticket-scan-results [data-scan-use]');
    check('number offered when the SD prefix is unreadable', chips.length ? chips[0].getAttribute('data-scan-use') : 'none', '264613131');
    check('panel says what the scan read', /What the scan read at the top/.test(document.getElementById('ticket-scan-results').textContent) ? 'yes' : 'no', 'yes');
    if (chips.length) chips[0].click();
    check('tapping it fills the ticket no.', document.querySelector('#ticket-scan-results [data-scan-field="ticket_no"]').value, '264613131');

    // "Copy what was read" must always say something, clipboard or not.
    ticketScanRawText = 'Order No.: SD264613131';
    toasts.length = 0;
    ticketScanCopyRaw();
    setTimeout(function() {
        check('copy button reports back', /copied|Copying is blocked/.test(toasts.join(' | ')) ? 'yes' : 'no', 'yes');
        document.getElementById('out').textContent = out.join('\n');
    }, 30);
} catch (e) {
    testErrors.push('THROWN ' + e.name + ': ' + e.message);
}
out.push('errors=' + (testErrors.length ? testErrors.join(' | ') : 'none'));
document.getElementById('out').textContent = out.join('\n');
</script>
</body>
</html>
